# :8083 → turnstile replica 전부. 상태는 Redis에 있으므로 어느 replica로 가도 같다
# ponytail: replica IP는 nginx 시작 때 한 번만 해석한다. 대수를 바꾸면 turnstile-lb를 재시작할 것
worker_processes auto;
worker_rlimit_nofile 65536;
events { worker_connections 16384; }

http {
    access_log off;
    upstream turnstile {
        # max_fails=0: 기동 중 한 번 거절됐다고 10초간 빼지 않는다. 죽은 replica는 매 요청 다음 replica로 넘어간다
        server turnstile:8080 max_fails=0;  # Docker DNS가 replica마다 A 레코드를 돌려준다
        keepalive 256;
    }
    server {
        listen 8083;
        location / {
            proxy_pass http://turnstile;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
