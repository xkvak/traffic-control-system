global:
  scrape_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: services
    metrics_path: /metrics

    static_configs:
      - targets:
          - "gateway:8080"
        labels:
          service: gateway
          replica: gateway

      - targets:
          - "app1:8080"
        labels:
          service: api-server
          replica: app1

      - targets:
          - "app2:8080"
        labels:
          service: api-server
          replica: app2

  # replica 수가 바뀌어도 모두 수집하도록 DNS로 발견한다 (--scale turnstile=N)
  - job_name: turnstile
    metrics_path: /metrics
    dns_sd_configs:
      - names: ["turnstile"]
        type: A
        port: 8080
    relabel_configs:
      - target_label: service
        replacement: turnstile
      - source_labels: [__address__]
        target_label: replica
