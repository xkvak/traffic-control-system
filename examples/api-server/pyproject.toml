[project]
name = "api-server"
version = "0.1.0"
description = "Example concert reservation API protected by the turnstile queue"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "aiomysql",
    "cryptography", # MySQL 8 기본 인증(caching_sha2_password)에 필요
    "prometheus-client",
]

[dependency-groups]
dev = ["pytest", "httpx2"]
