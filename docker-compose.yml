x-api-server: &api-server
  build: ./examples/api-server
  restart: unless-stopped
  environment:
    MYSQL_HOST: mysql
  depends_on:
    mysql:
      condition: service_healthy
  # host 포트를 열지 않는다: Gateway를 거치지 않는 직접 호출을 막는다

services:
  keygen:
    build: ./turnstile
    command:
      [
        "/app/.venv/bin/python",
        "keygen.py",
        "/keys/private.pem",
        "/keys/public/public.pem",
      ]
    volumes:
      - ./turnstile/keys:/keys
    restart: "no"

  turnstile:
    build: ./turnstile
    restart: unless-stopped
    deploy:
      replicas: 3 # 컨테이너당 프로세스 1개. 앞단 turnstile-lb가 8083으로 받아 나눠 준다
    environment:
      REDIS_URL: redis://redis:6379
      PRIVATE_KEY_FILE: /keys/private.pem
      MAX_ACTIVE_USERS: ${MAX_ACTIVE_USERS:-3000}
      ADMIT_RATE_PER_SEC: ${ADMIT_RATE_PER_SEC:-60}
      MAX_WAITING: ${MAX_WAITING:-70000} # 전체 대기 한도. turnstile 1대 기준이라 N대면 N × 70,000
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-60}
      ADMIN_TOKEN: ${TURNSTILE_ADMIN_TOKEN:-}
      COOKIE_SECURE: ${TURNSTILE_COOKIE_SECURE:-false} # 로컬 http 데모용. https 운영에서는 true
    volumes:
      - ./turnstile/keys:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  turnstile-lb:
    image: nginx:1.28.0-alpine
    container_name: turnstile-lb
    restart: unless-stopped
    ports:
      - "8083:8083" # README·Locust·vite 기본 주소
    volumes:
      - ./nginx/turnstile-lb.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - turnstile

  gateway:
    build: ./examples/gateway
    container_name: gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      UPSTREAMS: http://app1:8080,http://app2:8080
      TOKEN_RATE_PER_SEC: ${TOKEN_RATE_PER_SEC:-2}
      TOKEN_BURST: ${TOKEN_BURST:-10}
    volumes:
      - ./turnstile/keys/public:/keys:ro
    depends_on:
      keygen:
        condition: service_completed_successfully
      app1:
        condition: service_started
      app2:
        condition: service_started

  web-client:
    build: ./examples/web-client
    container_name: web-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://gateway:8080}
      VITE_TURNSTILE_PROXY_TARGET: ${VITE_TURNSTILE_PROXY_TARGET:-http://turnstile:8080}
    depends_on:
      gateway:
        condition: service_started
      turnstile:
        condition: service_started

  app1: *api-server
  app2: *api-server

  mysql:
    image: mysql:8.0
    container_name: concert-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: concert_db
    ports:
      - "3306:3306"
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.6.0
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
